name: Build SafeCircle APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Create Flutter project
        run: flutter create safecircle_app
      - name: Copy files
        run: |
          cp -r safecircle_clean/lib/* safecircle_app/lib/
          cp safecircle_clean/pubspec.yaml safecircle_app/
          cp safecircle/android/app/google-services.json safecircle_app/android/app/
          mkdir -p safecircle_app/assets/images
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' safecircle_app/android/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' safecircle_app/android/app/build.gradle
      - name: Build APK
        run: cd safecircle_app && flutter pub get && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeCircle-APK
          path: safecircle_app/build/app/outputs/flutter-apk/app-debug.apk
