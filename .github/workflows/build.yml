name: Build SafeCircle APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: mkdir -p safecircle_clean/assets/images
      - run: cd safecircle_clean && flutter pub get
      - run: cd safecircle_clean && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeCircle-APK
          path: safecircle_clean/build/app/outputs/flutter-apk/app-debug.apk
