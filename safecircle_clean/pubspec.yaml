name: safecircle
description: SafeCircle - Family Safety App by Datanura AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.6
  geolocator: ^10.1.0
  http: ^1.1.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  uuid: ^4.2.2
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2
  permission_handler: ^11.1.0
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
